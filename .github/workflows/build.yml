# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# 推送任意 tag（v1.0.1 / 1.0.1 / V1.0.1 均可）时，会额外从 CHANGELOG.md 抽取该版本的小节，
# 自动创建 GitHub Release 并把 build/libs/*.jar 作为附件上传。
# Release 标题会带上本分支的 MC 支持区间，形如 "v1.0.2 (Minecraft 1.21.1–1.21.4)"。
# 详见文件末尾的两个步骤。
#
# 注意：不要在这里把条件收紧成只认 "v" 前缀。曾经因为写成 refs/tags/v*，
# 而实际 tag 名为 1.0.1，导致推送 tag 后 Release 完全没有被创建、也没有任何报错。
# 版本号统一用下面 extract 步骤里的 ${TAG#[vV]} 归一化即可。
#
# tag 约定：只用版本号，不要把 MC 区间写进 tag（区间由产物名与 Release 标题承担）。
# 若把区间写进 tag，归一化后的名字匹配不到 CHANGELOG 的 "## <版本号>" 小节，
# 会静默回退成把整份 CHANGELOG 当作 Release 正文。

name: build
on: [pull_request, push]

# gh release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      # ------------------------------------------------------------------
      # 以下是"打 tag 时自动发布 Release"的部分。
      # 普通 push / PR 不会执行（两个步骤都带 if 条件）。
      # ------------------------------------------------------------------

      - name: extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 归一化：先剥掉可选的 v/V 前缀，再丢掉 semver 的 +build-metadata 后缀
          # （后者让 v1.0.3+mc1.21.1-1.21.4 这类写法也能正确匹配 CHANGELOG 小节）
          VERSION="${TAG#[vV]}"
          VERSION="${VERSION%%+*}"
          echo "标签：$TAG    版本：$VERSION"

          # 抽取 "## <版本号>" 开头、到下一个标题或 --- 分隔线之前的内容
          awk -v ver="$VERSION" '
            BEGIN { pat = "^## " ver "([^0-9.]|$)" }
            $0 ~ pat { found = 1; next }
            found && ($0 ~ /^## / || $0 == "---") { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 中没有与 $VERSION 对应的小节，Release 正文将使用整个 CHANGELOG。"
            cp CHANGELOG.md release-notes.md
          fi

          echo "-------- release-notes.md --------"
          cat release-notes.md

      - name: create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          JAR_DIR: ${{ github.workspace }}/build/libs
        run: |
          set -euo pipefail
          ls -l "$JAR_DIR"

          # 标题带上本分支的 MC 支持区间（与 gradle.properties 同源），
          # 这样从 tag 列表里也能一眼看出该版本覆盖哪些 MC 版本。
          MC_MIN=$(sed -n 's/^minecraft_version_min=//p' gradle.properties | tr -d '[:space:]')
          MC_MAX=$(sed -n 's/^minecraft_version_max=//p' gradle.properties | tr -d '[:space:]')
          TITLE="$TAG (Minecraft $MC_MIN–$MC_MAX)"
          echo "Release 标题：$TITLE"

          # 只上传主 jar，排除 -sources.jar。
          # 当前配置已不再生成 sources jar，但历史 tag 指向的旧提交仍会生成它，
          # 万一重跑那些 tag，这里保证 Release 不会被重新塞进多余文件。
          JARS=()
          for f in "$JAR_DIR"/*.jar; do
            case "$f" in *-sources.jar) echo "跳过 $f" ;; *) JARS+=("$f") ;; esac
          done
          echo "将上传：${JARS[*]}"

          # 幂等：同一个 tag 重跑工作流时更新已有 Release，而不是报"已存在"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为更新。"
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "${JARS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --verify-tag \
              "${JARS[@]}"
          fi

          echo "完成：$(gh release view "$TAG" --json url -q .url)"
