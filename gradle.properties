# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
#
# minecraft_version 是"编译目标"：mappings、开发环境运行都以它为准。
# 本分支按惯例取**支持区间里最旧的那个版本**作编译目标（1.20）。
minecraft_version=1.20
yarn_mappings=1.20+build.1
# loader_version 同时决定两件事，所以它降下来能直接放宽对玩家的要求：
#   ① 编译期依赖 ② fabric.mod.json 的 depends.fabricloader（玩家可见的硬门槛）。
# 取 1.20 时期的同期 loader：0.14.21。
loader_version=0.14.21
# loom_version 是纯构建期设置（玩家不运行它）。1.13.6 是当前 Gradle 8.14.2 + JDK 21 允许的最高版本，
# 且 Loom 与 MC 版本解耦，同样能处理 1.20。
loom_version=1.13.6

# 声明支持的 MC 区间（含端点）。这一代（1.20 – 1.20.4）与 1.20.5+ 属于两代 API：
# 还没有"栈上限重构"（没有 Inventory#getMaxCount(ItemStack)，也没有物品组件），
# 运行环境是 Java 17，所以必须单独一条分支。
minecraft_version_min=1.20
minecraft_version_max=1.20.4

# Mod Properties
# 与 1.0.x（1.20.5–1.21.4）、1.1.x（1.21.5+）、1.2.x（1.21.11+）分开编号。
mod_version=1.3.1
maven_group=com.zhugey.betteritemstack
archives_base_name=BetterItemStack

# Dependencies
# fabric_version 是编译期依赖。Fabric API 按 MC 小版本分支，
# 1.20 分支是 0.76.1+1.20 → 0.83.0+1.20，这里取该分支的最后一版。
# 本 Mod 只用到 CommandRegistrationCallback(+其父类型 Event)，自 2019 年就存在，
# 所以编译期取哪个版本都不会给玩家造成额外要求（depends.fabric-api 仍写 *）。
fabric_version=0.83.0+1.20
