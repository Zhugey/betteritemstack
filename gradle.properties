# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
#
# minecraft_version 是"编译目标"：mappings、开发环境运行都以它为准。
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
# loader_version 同时决定两件事，所以它降下来能直接放宽对玩家的要求：
#   ① 编译期依赖 —— 保证代码只用得到该版本就有的 loader API（编译不过就说明用超了）；
#   ② fabric.mod.json 的 depends.fabricloader（写成 >=${loader_version}）—— 玩家可见的硬门槛。
# 取 1.21.11 发布前后能用的 loader：0.18.2。
# 已核验：本 Mod 用到的 loader 成员在该版本中存在（编译通过即为证据）。
loader_version=0.18.2
# loom_version 是纯构建期设置（玩家不运行它），方向与 loader 相反：
# 新版 Loom 支持旧 MC、旧版 Loom 处理不了更新的 MC，所以不要为兼容玩家而降级。
# 1.13.6 是当前 Gradle 8.14.2 + JDK 21 允许的最高版本（1.14+ 要求 Gradle 9.2，1.18 要求 Gradle 9.7 + JDK 25）。
# Loom 与 MC 版本解耦，同一份 Loom 可处理任意 MC；本分支已实测可用。
# 固定为正式版而非 SNAPSHOT：SNAPSHOT 是浮动版本，同一份代码在不同时间可能拉到不同快照，构建不可复现。
# 注意：产物结构随 Loom 版本变化——1.11.x 仍生成 refmap，1.12 起（实测 1.12.7）不再生成，
# 改为把注解里的注入目标就地重映射为 intermediary。mc_compat_check.py 已同步支持两条路径。
loom_version=1.13.6

# 声明支持的 MC 区间（含端点）。与编译目标是两回事：
# 本 Mod 产出的是 intermediary 命名空间的 jar，只要用到的符号在新版本里依旧存在即可直接运行，
# 无需重新编译。区间来自逐版本静态核对（intermediary 符号存在性 + @Redirect 调用次数）。
# 本分支只覆盖 1.21.11 一个版本：它是 1.21.x 的最后一个正式版，也是权限体系换代的那一版
# （CommandSource#hasPermissionLevel(int) 被新的 PermissionPredicate 体系取代），
# 因此旧的 1.21.5 构建在它上面用不了，必须单独出一条分支。
minecraft_version_min=1.21.11
minecraft_version_max=1.21.11

# Mod Properties
# 与 1.21.1 线的 1.0.x、1.21.5 线的 1.1.x 分开编号：
# tag 在仓库内全局唯一，且 CHANGELOG 抽取按 tag 名匹配小节，同名会取到另一条线的历史记录。
mod_version=1.2.0
maven_group=com.zhugey.betteritemstack
archives_base_name=BetterItemStack

# Dependencies
# fabric_version 是编译期依赖，决定"代码最多能用多新的 API"。
# 注意 Fabric API 是"每个 MC 一个分支"（1.21.11 分支共 27 个版本，0.135.1 → 0.139.x），
# 所以 depends.fabric-api 只能写 *，不能写数字下限。
# 本 Mod 实际只用到 CommandRegistrationCallback(+其父类型 Event)，这两个自 2019 年就存在，
# 因此编译期取较新的版本不会给玩家造成额外要求。
fabric_version=0.139.5+1.21.11
