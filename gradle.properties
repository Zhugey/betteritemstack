# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
#
# minecraft_version 是"编译目标"：mappings、开发环境运行都以它为准。
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
loom_version=1.11-SNAPSHOT

# 声明支持的 MC 区间（含端点）。与编译目标是两回事：
# 本 Mod 产出的是 intermediary 命名空间的 jar，只要用到的符号在新版本里依旧存在即可直接运行，
# 无需重新编译。区间由 .workbuddy/tools/verify/mc_compat_check.py 逐版本静态验证得出，
# 1.21.5 起 ComponentHolder.get(ComponentType) 被移除，故上限为 1.21.4。
minecraft_version_min=1.21.1
minecraft_version_max=1.21.4

# Mod Properties
mod_version=1.0.1
maven_group=com.zhugey.betteritemstack
archives_base_name=BetterItemStack

# Dependencies
# fabric_version 取 1.21.1 的"最早"Fabric API 版本（0.101.2+1.21.1，2024-08-07），
# 而不是最新版。理由：编译期依赖决定"代码最多能用多新的 API"，取最早的那一版即可保证
# 只用得到当时就存在的 API，从而兼容玩家手里的任意 Fabric API（新版向后兼容旧 API）。
# 本 Mod 实际只用到 CommandRegistrationCallback(+其父类型 Event)，这两个自 2019 年就存在。
fabric_version=0.101.2+1.21.1