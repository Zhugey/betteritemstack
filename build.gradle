plugins {
	id 'fabric-loom' version "${loom_version}"
}

// 产物名带上"支持的 MC 区间"而不是编译目标，避免出现"文件名写着 1.21.1、实际支持到 1.21.4"的误导。
version = project.mod_version + "-" + project.minecraft_version_min + "-" + project.minecraft_version_max
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	// 版本号统一在 gradle.properties 中维护
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// 在配置阶段就取值并保存为脚本局部变量。
// processResources 的 filesMatching 闭包是在"执行阶段"才调用的，若在闭包内直接访问 project，
// 会触发 Gradle 弃用告警 "Invocation of Task.project at execution time"
//（Gradle 10.0 起为错误，且与配置缓存不兼容）。
def modVersion = project.version
def mcVersion = project.minecraft_version
def mcVersionMin = project.minecraft_version_min
def mcVersionMax = project.minecraft_version_max
def loaderVersion = project.loader_version
def licenseFilePrefix = project.archives_base_name

processResources {
	inputs.property "version", modVersion
	inputs.property "minecraft_version", mcVersion
	inputs.property "minecraft_version_min", mcVersionMin
	inputs.property "minecraft_version_max", mcVersionMax
	inputs.property "loader_version", loaderVersion
	// 必须写成赋值形式：filteringCharset "UTF-8" 这种"属性名 值"的空格调用写法已弃用。
	filteringCharset = "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_version": mcVersion,
				"minecraft_version_min": mcVersionMin,
				"minecraft_version_max": mcVersionMax,
				"loader_version": loaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	// 1.20 – 1.20.4 的运行环境是 Java 17（1.20.5 才升到 21），
	// 所以这里必须编译成 Java 17 字节码，否则玩家在 Java 17 上会直接报"类文件版本过高"。
	it.options.release.set(17)
}

java {
	if (JavaVersion.current() < JavaVersion.toVersion(21)) {
		toolchain.languageVersion = JavaLanguageVersion.of(21)
	}
	// 刻意不调用 withSourcesJar()。本模组只通过 GitHub Release 分发给玩家，
	// 源码本来就在仓库里公开，附一个 -sources.jar 对玩家没有意义
	// （Mod Menu / REI / Iris / AppleSkin 等流行模组的 Release 也都只放主 jar）。
	// 该产物原本来自 Fabric 官方示例模板，示例模板同时还演示发布到 Maven，
	// 那种场景下 sources jar 才有用（供依赖方在 IDE 里挂源码）。
}

jar {
	from("LICENSE") {
		rename { "${it}_${licenseFilePrefix}" }
	}
}
